name: taller-bd-distribuidas

services:
  postgres:
    image: postgres:16-alpine
    container_name: tbd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg}
      POSTGRES_DB: ${POSTGRES_DB:-investigation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d investigation"]
      interval: 3s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: tbd-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: tbd-mongo
    # SIN AUTH intencional (vulnerabilidad educativa E2)
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 5s
      retries: 15

  mongo-express:
    image: mongo-express:1.0.2
    container_name: tbd-mongo-express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    depends_on:
      mongo:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: tbd-redis
    # SIN PASSWORD intencional (vulnerabilidad educativa E3)
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: tbd-redisinsight
    ports:
      - "8083:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: tbd-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  seeder:
    build:
      context: ./seeder
    container_name: tbd-seeder
    environment:
      POSTGRES_URL: postgres://pg:pg@postgres:5432/investigation
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"

  dashboard:
    build:
      context: ./dashboard
    container_name: tbd-dashboard
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-cambia-este-secreto-en-clase}
      POSTGRES_URL: postgres://pg:pg@postgres:5432/investigation
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      GAME_DB_PATH: /data/game.db
    volumes:
      - dashboard_state:/data
    depends_on:
      seeder:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  redisinsight_data:
  qdrant_data:
  dashboard_state:
